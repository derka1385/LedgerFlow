<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none"><title>LedgerFlow — flux de fils</title><style>.drift{animation:drift 9s ease-in-out infinite alternate;transform-origin:center}.second{animation-delay:-4s}@keyframes drift{from{transform:translate(-24px,12px) rotate(-3deg)}to{transform:translate(24px,-12px) rotate(3deg)}}@media(prefers-reduced-motion:reduce){.drift{animation:none}}*{animation:none!important}</style><defs><linearGradient id="ink"><stop stop-color="#91c0a3" stop-opacity=".15"/><stop offset=".5" stop-color="#e7efc7"/><stop offset="1" stop-color="#91c0a3" stop-opacity=".15"/></linearGradient><path id="thread" d="M-100 320C90 380 115 30 315 120S500 390 750 60"/></defs><g class="drift" stroke="url(#ink)" stroke-width="1.2"><use href="#thread"/><use href="#thread" transform="translate(0 12)"/><use href="#thread" transform="translate(0 24)"/><use href="#thread" transform="translate(0 36)"/><use href="#thread" transform="translate(0 48)"/><use href="#thread" transform="translate(0 60)"/><use href="#thread" transform="translate(0 -12)"/><use href="#thread" transform="translate(0 -24)"/><use href="#thread" transform="translate(0 -36)"/><use href="#thread" transform="translate(0 -48)"/><use href="#thread" transform="translate(0 -60)"/></g><g class="drift second" stroke="#a9ccad" stroke-opacity=".2"><use href="#thread" transform="translate(0 80)"/><use href="#thread" transform="translate(0 92)"/><use href="#thread" transform="translate(0 -80)"/></g></svg>
