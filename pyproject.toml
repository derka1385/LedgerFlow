[project]
name = "ledgerflow"
version = "0.1.0"
description = "LedgerFlow backend: receipt-to-approved-XLSX orchestration API and worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "defusedxml>=0.7.1",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "openpyxl>=3.1.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledgerflow*"]

[tool.setuptools.package-data]
"ledgerflow.persistence" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
