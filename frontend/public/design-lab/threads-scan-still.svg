<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none"><title>LedgerFlow — lecture d’une pièce</title><style>.beam{animation:read 4s cubic-bezier(.77,0,.175,1) infinite}.result{animation:result 4s ease-out infinite}@keyframes read{0%,10%{transform:translateY(-110px);opacity:0}20%{opacity:1}70%{transform:translateY(110px);opacity:1}85%,100%{transform:translateY(110px);opacity:0}}@keyframes result{0%,65%{opacity:.15}80%,100%{opacity:1}}@media(prefers-reduced-motion:reduce){.beam{animation:none;opacity:.35}.result{animation:none}}*{animation:none!important}</style><defs><linearGradient id="beam"><stop stop-color="#bfdfaa" stop-opacity="0"/><stop offset=".5" stop-color="#e9f6c8"/><stop offset="1" stop-color="#bfdfaa" stop-opacity="0"/></linearGradient></defs><path d="M260 86H359L380 108V313L365 303L350 313L335 303L320 313L305 303L290 313L275 303L260 313Z" fill="#dfebcc" fill-opacity=".12" stroke="#cce0b9" stroke-opacity=".5"/><g stroke="#c3d9b1" stroke-opacity=".65" stroke-width="1.2"><path d="M80 134C180 134 180 144 288 144H346M80 154C180 154 180 164 288 164H346M80 174C180 174 180 184 288 184H346M560 215C460 215 460 204 352 204H288M560 235C460 235 460 224 352 224H288M560 255C460 255 460 244 352 244H288"/></g><g class="beam"><path d="M100 200H540" stroke="url(#beam)" stroke-width="2"/><path d="M160 206H480M200 212H440" stroke="url(#beam)" opacity=".25"/></g><g class="result"><circle cx="350" cy="285" r="15" fill="#d6e9b7"/><path d="M343 285L348 290L357 280" stroke="#174b39" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
