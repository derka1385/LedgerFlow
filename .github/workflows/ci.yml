name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: OpenTofu / validate and mocked plans
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra/opentofu
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.13.10'
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false -lockfile=readonly
      - run: tofu validate
      - name: Test firewall and VM plans without cloud credentials
        run: tofu test
      - name: Check bootstrap shell syntax
        run: bash -n bootstrap.sh

  python:
    name: Python / backend and accounting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledgerflow
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: ledgerflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerflow -d ledgerflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEDGERFLOW_TEST_DATABASE_URL: postgresql://ledgerflow:ci-only-throwaway@localhost:5432/ledgerflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Generate synthetic benchmark receipts
        run: uv run --frozen --extra dev python benchmark/corpus.py
      - name: Test backend, accounting, and benchmark harness
        run: >-
          uv run --frozen --extra dev pytest -ra --tb=short
          tests accounting/tests benchmark/test_bench.py
          --junitxml=test-results/python.xml
      - name: Upload Python results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend / tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Type-check and build
        run: npm run build

  sandbox:
    name: Sandbox / real Linux Docker containment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LEDGERFLOW_SANDBOX_IMAGE: python:3.12-slim
      PYTHONPATH: frontend/dev-mock-api:accounting:benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
      - name: Generate synthetic benchmark receipts
        run: uv run --frozen --extra dev python benchmark/corpus.py
      - name: Require Docker and pull execution image
        run: |
          docker info
          docker pull "$LEDGERFLOW_SANDBOX_IMAGE"
          image_id=$(docker image inspect "$LEDGERFLOW_SANDBOX_IMAGE" --format '{{.Id}}')
          echo "LEDGERFLOW_SANDBOX_IMAGE=$image_id" >> "$GITHUB_ENV"
      - name: Run storage, lifecycle, and HTTP integration tests
        run: >-
          uv run --frozen --extra dev pytest -ra --tb=short
          frontend/dev-mock-api/test_sandbox.py
          frontend/dev-mock-api/test_mock_api.py
          frontend/dev-mock-api/test_vsi_integration.py
          --junitxml=test-results/sandbox.xml
      - name: Reject skipped or empty runtime suites
        run: |
          uv run --frozen --extra dev python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('test-results/sandbox.xml').getroot().findall('.//testcase')
          assert cases, 'No runtime tests executed'
          skipped = [case.attrib.get('name') for case in cases if case.find('skipped') is not None]
          assert not skipped, f'Required runtime tests skipped: {skipped}'
          PY
      - name: Capture containment and legitimate Excel evidence
        run: >-
          uv run --frozen --extra dev python benchmark/security_evidence.py
          --host-label github-actions-${{ github.run_id }}-${{ github.run_attempt }}
          --output test-results/security-evidence.linux.json
      - name: Upload sandbox results and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-security-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
